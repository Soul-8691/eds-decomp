# Match gate + objdiff progress report, on every push and pull request.
# No ROM is needed anywhere in CI: every check compares compiled C against the original assembly
# committed under asm/ (tools/target.py), never against the game itself.
# decomp.dev reads the uploaded "AY5E_report" artifact from the default branch.
name: Progress report

on:
  push:
  pull_request:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same layout as a local build: agbcc built in ../agbcc, installed into tools/agbcc by the Makefile.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi
          git clone --depth 1 https://github.com/pret/agbcc ../agbcc
          (cd ../agbcc && ./build.sh)
          make agbcc
          sudo curl -fsSL -o /usr/local/bin/objdiff-cli \
            https://github.com/encounter/objdiff/releases/download/v3.8.2/objdiff-cli-linux-x86_64
          sudo chmod +x /usr/local/bin/objdiff-cli

      # The gate: every C unit (and authored assembly unit) must still match its original bytes.
      - name: Every unit matches its original assembly
        run: python3 tools/check_all.py -j "$(nproc)"

      # A pull request may not turn matching C back into assembly fallbacks.
      - name: Progress does not go backwards
        if: github.event_name == 'pull_request'
        run: |
          count() { python3 tools/progress.py | sed -n 's/^Decompiled: \([0-9]*\)\/.*/\1/p'; }
          head=$(count)
          git worktree add -q /tmp/base "${{ github.event.pull_request.base.sha }}"
          base=$(cd /tmp/base && count)
          echo "functions in matching source: base $base, this PR $head"
          [ "$head" -ge "$base" ]

      - name: Generate objdiff report
        run: make -j"$(nproc)" objdiff-report

      - name: Check report
        run: python3 tools/check_report.py build/report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: AY5E_report
          path: build/report.json
