# Generated by tools/hma_toml.py from baserom.toml for eds_release_demo_extra.gba (1436 card IDs, card numbers 0-1922). Do not edit;
# it is written again by every build of that ROM (`make demo`: eds_demo.toml, `make release-demo`: eds_release_demo.toml, `make release-demo-extra`: eds_release_demo_extra.toml).
#
# Each entry: name -- whether the game uses it in this build (release build) : what it is. [N] = entries.
#
# The original game (from baserom.toml). The card tables that moved, their lengths and the card lists
# follow this build; everything else is at its original address:
#  NamedAnchors (Goto menu):
#   graphics.cards.images -- used: every card's 72x80 art, by card ID, with graphics.cards.palettes (moved to
#       the end of the ROM with the added cards; one row per card ID)
#   graphics.cards.palettes -- used: the card art palettes, by card ID (moved, one row per card ID)
#   data.cards.stats -- used: every card's stats word (ATK, DEF, kind, type, Level, attribute), by card ID
#       (moved)
#   data.cards.passwords -- used: every card's password (BCD), by card ID (moved; FFFFFFFF = none)
#   data.cards.numbers -- used: card ID -> card number (moved; one row per card ID)
#   data.cards.internalnumbers -- used: card number -> card ID (one row per card number in use)
#   data.cards.effects -- used: the original effect table: card number or effect key, then the resolve, check,
#       prepare, chainA, chainB handlers (the added cards' rows: data.cards.addedeffects)
#   data.cards.fusion -- used: the Fusion recipes
#   data.cards.ritual -- used: the Ritual recipes
#   data.decks.all -- mostly UNUSED (every format opponent plays a data.decks.mod deck; only Solomon and Debug
#       fall back to theirs until a recipe is picked): every original duelist's deck (pointer, count), by the
#       duelists list
#   data.decks.initial.* [22] -- UNUSED (the three starter decks are the mod's: BuildModStarterDeck): the
#       original starter deck's pools: .cards and .stats per pool
#   data.packs.* [23] -- UNUSED (not in the shop, and Campaign rewards open format packs: ModRewardPack): the
#       original Campaign booster packs: per pack, a card list per rarity (by the rarities list)
#   data.specialpacks.* [24] -- UNUSED (not in the shop, and Campaign rewards open format packs: ModRewardPack):
#       the special packs (Weekly Yu-Gi-Oh! A and B, the magazine, the Grandpa Cup prize): their cards per
#       rarity
#   graphics.packs.* [31] -- UNUSED (as data.packs): the original booster pack covers, with
#       graphics.palettes.packs
#   graphics.palettes.packs -- used: the pack covers' palette (gPackListPal, 256 colours): the shop's covers
#       (graphics.packs.format.*) and its background
#   graphics.titlescreen.medal -- UNUSED (the title draws graphics.title.coin): the title screen's coin (inside
#       its pack)
#   graphics.palettes.titlescreen.medal -- UNUSED (as the coin): the coin's palette
#   graphics.titlescreen.gamelogo -- UNUSED (ModTitle_Load hides it: the title is "Yak's YGO Hack"): the title
#       screen's game logo
#   graphics.titlescreen.* -- used: the title screen's background grid (.background, 4 x 4 tiles; its address
#       and size corrected here), with graphics.palettes.titlescreen.*
#   graphics.palettes.titlescreen.logo -- UNUSED (as the logo): the game logo's palette
#   graphics.palettes.titlescreen.* -- used: the title screen palettes
#   data.duel.backgrounds -- used: the duel field's background texture per field (list fieldbackgrounds: the
#       normal field, then the Field Spells by GetFieldMagicIndex): a pointer to one of
#       graphics.duel.backgrounds.* (several share one: Mountain uses Wasteland's, Gaia Power Forest's, Umiiruka
#       Umi's, Luminous Spark Chorus of Sanctuary's, Mystic Plasma Zone Yami's)
#   graphics.duel.backgrounds.* [20] -- used: the field background textures: .image (32 x 32, 4bpp, tiled across
#       the board's BG0) and .palette, named after the first field that uses each
#   graphics.duelists.grandpa.* [8] -- used (Solomon has no card art: his portrait on the opponent select, his
#       face on the Records screen): Solomon's (Grandpa's) face (.face 48 x 16, .palette) and opponent-select
#       portrait (.portrait 56 x 56, .portraitpalette)
#   graphics.duelists.duelcomputer.* [8] -- UNUSED (hidden duelist): the Duel Computer's face and portrait
#   graphics.duelists.* [152] -- used: .scene / .eyes on the pre-duel screens; .face / .portrait only for an
#       opponent with no card art (Solomon): the original duelists by duelist: .face (48 x 16, 4bpp) and
#       .palette, the Records screen's (original data); .portrait (56 x 56, 8bpp) and .portraitpalette, the
#       opponent select's round portrait, cut from the page pictures (the mod's copy, which the game draws from:
#       data.opponents' portrait 0x8000 | page << 4 | slot names one); for the opponents without a pre-duel
#       picture, .scene (240 x 96, 8bpp) with .scenepalette and .eyes (the blinking eye sprites, 16 x 16 4bpp
#       tiles) with .eyespalette: the original pre-duel dialogue's scene, the mod's uncompressed copy
#       (tools/preduel_scenes.py) the pre-duel screen draws
#  MatchedWords (constants in the code and data):
#   data.constants.packs.rarities.* [9] -- UNUSED (as data.packs): the original packs' rarity odds (.total and
#       each rarity's weight)
#   data.constants.packs.unlocks.2wins* [5] -- effectively UNUSED (four of those duelists are hidden, so it
#       never passes): IsCampaignLevel2Unlocked: more than this many wins against each of duelists 1-5 (Yugi,
#       Tea, Joey, Tristan, Bakura) raise the campaign level: the original pack unlocks and the "New Duelists"
#       notice (text 350); the Records pages now follow the formats (ModRecordHasNextPage)
#   data.constants.packs.unlocks.* [3] -- UNUSED (only the original pack list reads it, and nothing shows that
#       list; the "new packs" notice follows the format packs: data.constants.packs.format.usagewins,
#       data.constants.formats.unlock.*): IsPackUnlocked: the wins that unlock the original Campaign packs
#   data.constants.fusion2 -- used: a Fusion constant of the original
#   data.constants.cards.limit2 [3] -- used: the card ID count in GeneratePackCards (random pack cards): the
#       last real card
#   data.constants.effects.limit -- used: the original effect table's row count
#  Lists (the names of table rows and enum values):
#   cardnumbers -- used: card names by card ID: the original cards, then the added ones (and make demo's blank
#       slots, 'Blank <id>')
#   cardinternalnumbers -- used: card names by card number, with the added cards at their numbers; then, after a
#       gap, the original duelists at 0x8000 | page << 4 | slot of their original opponent-select slot (32768
#       'Duelist - Yugi Muto' ... 32835 'Duelist - Trusdale (Grandpa)'), the values data.opponents' portrait
#       takes for an original portrait
#   rarities -- used: the pack rarities
#   types -- used: the card types
#   races -- used: the monster types
#   attributes -- used: the attributes
#   duelists -- used: the original duelists
#
# Added by Yak's YGO Hack (not in baserom.toml); by symbol, so they follow every build:
#  NamedAnchors (Goto menu):
#   data.cards.names -- used: every card's name (gCardNames: ASCII, 64 bytes; at most 41 characters fit a Deck
#       Edit row), by card ID
#   data.cards.descriptions -- used: every card's lore/effect text (gCardDescriptions: ASCII, 480 bytes, no line
#       breaks), by card ID
#   data.cards.nameorder -- used: the card IDs in name order, 0-terminated (gCardIdsByName): what Deck Edit, the
#       Trunk and Card Trading list (make demo's blank slots are left out until filled in)
#   graphics.cards.icons.* [2] -- used: every card's art icon (Deck Edit's ring): .palettes, .images (16x16
#       4bpp)
#   graphics.title.* [8] -- used: the title screen's images (tools/title_images.py), each .image and .palette:
#       text (BG0, the whole screen, 240 x 160, 4bpp, BG palette 8: "Yak's YGO Hack" at y 40), flame (BG1, the
#       whole screen, 240 x 160, 8bpp, 128 colours: BG palette entries 0-127, entry 0 the screen's backdrop; the
#       flames at x 72), coin (96 x 96, 4bpp), copyright (224 x 16, 4bpp). The game loads their distinct 8x8
#       tiles: the whole text, and at least 308 for the flames
#   text.title.* [3] -- used: the title's small lines: .version (make demo / release-demo), .release, .debug
#       (ASCII, at most 15 characters)
#   graphics.duel.board.* [2] -- used: the mod's duel board (gModDuelFieldImage, tools/duel_board.py: the Extra
#       Monster Zones and the phase panel): .tiles (its deduplicated 4bpp tiles; one tile can be used by many
#       cells, whose list is not anchored) and .palette
#   graphics.cards.fieldicons.* [2] -- used: the field icons: .artpalette (64 shared colours), .miniatures (each
#       card's 16x16 8bpp miniature)
#   data.cards.typeex -- used: each card ID's extended type (gCardTypeEx): kind (none, Synchro, Xyz, Link; the
#       stats word stores those as Fusion), effect, Tuner, and race (a race EDS lacks: Psychic, Wyrm, Cyberse,
#       Illusion, Creator-God, Divine-Beast; statstype = the stats word's)
#   data.cards.linkmarkers -- used: each card ID's Link Arrows (gCardLinkMarkers): top-left ... bottom-right
#   data.cards.addedeffects -- used: the added cards' effect rows (gAddedCardEffects): card, then the resolve,
#       check, prepare, chainA, chainB handlers; searched after data.cards.effects; last row 0xFFFF
#   data.packs.format.pools -- used: the shop's TCG and usage format packs: each pack's cards and pull weights
#       (all a pull reads; chance = weight / total)
#   data.packs.format.* [5] -- used: per format pack: .names, .flags (1 = usage pack), .formats, .releasedates
#       (yyyymmdd), .portraits (cover card)
#   text.packs.format.* [44] -- used: the format pack names (ASCII)
#   graphics.packs.format.* [44] -- used: each format pack's shop cover (gFormatPackCovers: 56 x 112, 8bpp,
#       palette graphics.palettes.packs), named after the pack. Made from its portrait card's art when the ROM
#       is built (tools/format_pack_covers.py), so a new data.packs.format.portraits card needs a new cover too
#       (or a rebuild)
#   data.prices.cards -- used: the DP to buy a card by password, per format: card and price
#   data.decks.mod.yugideck.* [2] -- UNUSED (Yugi is a hidden duelist): Yugi's deck (30 7 Colored Fish)
#   data.decks.mod.reddeck.* [3] -- UNUSED: Tea's deck (LR-Chaos Turbo)
#   data.decks.mod.joeydeck.* [3] -- UNUSED: Joey's deck (sdlkilla-Warrior)
#   data.decks.mod.bakuradeck.* [3] -- UNUSED: Bakura's deck (geistD-Goat Control)
#   data.decks.mod.* [125] -- used (the format opponents): the format opponents' decks
#       (data.decks.mod.<format><deck>): .list the DeckList (cards, count), .main the main + Fusion Deck, .side
#       the Side Deck
#   data.decks.recipes -- UNUSED (GetRecipePreset returns 0 in the release): the debug menu's deck recipes:
#       name, DeckList, Side Deck, side count; last row the terminator
#   text.decks.recipes.* [44] -- UNUSED: the deck recipe names (ASCII)
#   graphics.preduel.* [44] -- used: the pre-duel pictures and QR codes per format: <format>.picture the 240x96
#       picture, .palette its 224 colours (Yugi-Kaiba to Android), .qr.image the formatlibrary.com QR code (1 =
#       dark module; every format), .qr.palette
#   data.preduel.table -- used: the pre-duel screen per opponent (by duelist, list opponents): picture (its own
#       picture's data, or 0), qr (the data whose QR code it shows, or 0: none), scene (with no picture: its
#       duelist's scene copy, graphics.duelists.<duelist>.scene / .eyes)
#   data.preduel.text -- used: the pre-duel screen's text per opponent: line1-line5, up to 38 characters each
#       inside the box's border (10 spaces where the QR code is)
#   data.preduel.* [16] -- used: per format: .qrsize, the QR code modules a side (0 = none)
#   data.opponents -- used: the opponents by duelist ID (list opponents): kind (hidden, format, deck), unlock
#       order, format, .name, and .portrait: the card whose art the opponent select and the Records screen show
#       (0: the original portrait; 0x8000 | page << 4 | slot: an original page's portrait, e.g. Solomon)
#   text.opponents.* [18] -- used: the opponent names (ASCII)
#   graphics.opponents.* [34] -- used: the Records screen's face of each opponent with a card art portrait
#       (format opponents, Debug, Test Duel): .face (48 x 16, 4bpp) and .facepalette (entries 1-15). Made from
#       the portrait card's art when the ROM is built (tools/record_faces.py), so a new portrait card in
#       data.opponents needs a new face too (or a rebuild)
#  MatchedWords:
#   data.constants.title.flamewave -- used: the title's flames during the fade-in: 1 wave (the original), 0 stay
#       still
#   data.constants.title.flamepriority -- used: the title's flames' layer priority (BG1, 0 front to 3 back): 1
#       in front of the coin and the copyright line (the original), 3 behind them
#   data.constants.preduel.qrsquare -- used: the pre-duel screens' white square behind the QR code: 1 on (dark
#       modules on white), 0 off (no square: the box and its decorated border show, the modules drawn white)
#   data.constants.packs.format.usagewins -- used: wins against a format that open its usage pack
#   data.constants.formats.unlock.* [14] -- used: per format: wins against the format before it that open it,
#       and with it its TCG packs
#  Lists:
#   formatpacks -- used: the 50 format pack names (indexes data.packs.format.*)
#   formats -- used: the 15 Campaign formats in banlist order (indexes data.prices.cards,
