#   data.cards.fusion -- used: the Fusion recipes
#   data.cards.ritual -- used: the Ritual recipes
#   data.decks.all -- mostly UNUSED (every format opponent plays a data.decks.mod deck; only Solomon and Debug
#       fall back to theirs until a recipe is picked): every original duelist's deck (pointer, count), by the
#       duelists list
#   data.decks.initial.* [22] -- UNUSED (the three starter decks are the mod's: BuildModStarterDeck): the
#       original starter deck's pools: .cards and .stats per pool
#   data.packs.* [23] -- UNUSED (not in the shop, and Campaign rewards open format packs: ModRewardPack): the
#       original Campaign booster packs: per pack, a card list per rarity (by the rarities list)
#   data.specialpacks.* [24] -- UNUSED (not in the shop, and Campaign rewards open format packs: ModRewardPack):
#       the special packs (Weekly Yu-Gi-Oh! A and B, the magazine, the Grandpa Cup prize): their cards per
#       rarity
#   graphics.packs.* [31] -- UNUSED (as data.packs): the original booster pack covers, with
#       graphics.palettes.packs
#   graphics.palettes.packs -- UNUSED (as data.packs): the pack covers' palette
#   graphics.titlescreen.gamelogo -- UNUSED (ModTitle_Load hides it: the title is "Yak's YGO Hack"): the title
#       screen's game logo
#   graphics.titlescreen.* [2] -- used: the title screen: .background, .medal, with
#       graphics.palettes.titlescreen.*
#   graphics.palettes.titlescreen.logo -- UNUSED (as the logo): the game logo's palette
#   graphics.palettes.titlescreen.* [2] -- used: the title screen palettes
#  MatchedWords (constants in the code and data):
#   data.constants.packs.rarities.* [9] -- UNUSED (as data.packs): the original packs' rarity odds (.total and
#       each rarity's weight)
#   data.constants.packs.unlocks.2wins* [5] -- effectively UNUSED (four of those duelists are hidden, so it
#       never passes): IsCampaignLevel2Unlocked: more than this many wins against each of duelists 1-5 (Yugi,
#       Tea, Joey, Tristan, Bakura) raise the campaign level: the original pack unlocks and the "New Duelists"
#       notice (text 350); the Records pages now follow the formats (ModRecordHasNextPage)
#   data.constants.packs.unlocks.* [3] -- UNUSED (only the original pack list reads it, and nothing shows that
#       list; the "new packs" notice follows the format packs: data.constants.packs.format.usagewins,
#       data.constants.formats.unlock.*): IsPackUnlocked: the wins that unlock the original Campaign packs
#   data.constants.fusion2 -- used: a Fusion constant of the original
